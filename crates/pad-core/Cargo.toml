[package]
name = "pad-core"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Performance", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Diagnostics_ToolHelp", "Win32_Media", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_System_Com", "Win32_Media_Multimedia", "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Foundation", "Foundation_Collections", "Foundation_Metadata", "Storage_Streams", "Media_SpeechRecognition", "Globalization"] }

[dev-dependencies]
ctrlc = "3.5.2"
