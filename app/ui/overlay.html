<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gemini</title>
  <link rel="stylesheet" href="css/overlay.css">
  <link rel="stylesheet" href="css/overlay-live.css">
  <script type="module" src="js/overlay/main.js"></script>
</head>
<body>
  <!-- The Gemini overlay (overlay.rs). The window is transparent; only these shapes are visible. -->
  <main id="ov">
    <i class="glow" aria-hidden="true"></i>
    <section id="cards" aria-live="polite"></section>

    <section id="keycard" class="glass card setup" hidden>
      <h2>Add your Gemini key</h2>
      <p>Gemini answers come from your own free key from Google AI Studio. It's saved only on this PC.</p>
      <p class="fine">The free tier has limits, and on the free tier Google may use what you send to improve its products, so don't share a screen with private things on it.</p>
      <div class="keyrow">
        <input id="keyIn" type="password" placeholder="Paste your key" autocomplete="off" spellcheck="false">
        <button id="keyPaste" class="ghost" type="button">Paste</button>
      </div>
      <div class="keyacts">
        <button id="keyStudio" class="ghost" type="button">Open AI Studio</button>
        <button id="keySave" class="primary" type="button">Save</button>
      </div>
      <p id="keyMsg" class="msg" role="status"></p>
    </section>

    <section id="pillwrap" hidden>
      <button id="share" class="glass share" type="button">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="26" height="20" rx="5"/><path d="M16 21v-9M12 15.5l4-4 4 4"/></svg>
        <span>Share screen with Live</span>
      </button>
      <div id="pillbox">
        <i class="aura" aria-hidden="true"></i>
      <div id="pill" class="glass pill">
        <div class="rip" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="handle" id="handle" title="Drag to move"></div>
        <button id="plus" class="icon" type="button" aria-label="More">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
        </button>
        <input id="field" class="field" placeholder="Ask Gemini" autocomplete="off" spellcheck="false" aria-label="Ask Gemini">
        <button id="mic" class="mic" type="button" aria-label="Talk">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button id="live" class="icon" type="button" aria-label="Talk live">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
        </button>
      </div>
      </div>
      <p id="hint" class="hint" role="status"></p>
      <div id="kb"></div>
    </section>
    <!-- Gemini Live (live-view.js): the pill springs into this panel; the orb is the waveform. -->
    <section id="livewrap" hidden>
      <div class="lpanel" id="lpanel">
        <i class="ledge" aria-hidden="true"></i><i class="lspec" aria-hidden="true"></i>
        <div class="ltop"><i class="spark" aria-hidden="true"></i>Gemini Live</div>
        <div class="lstate" id="lstate" role="status">Connecting…</div>
        <div class="lstage" id="lstage" aria-hidden="true">
          <div class="lhalo"></div>
          <div class="orb"><div class="blobs"><b></b><b></b><b></b><b></b><b></b></div><div class="oshade"></div></div>
        </div>
        <div class="lcap" aria-live="polite"><span class="lyou" id="lyou"></span><span class="lold" id="lold"></span> <span id="lnow"></span></div>
        <div class="lctl">
          <button id="lmute" class="lc" type="button" aria-label="Mute mic" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/></svg>
          </button>
          <button id="lshare" class="lc" type="button" aria-label="Share screen" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 14V8M9 11l3-3 3 3"/></svg>
          </button>
          <button id="lend" class="lc end" type="button" aria-label="End Live">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
