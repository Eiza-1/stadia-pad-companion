[package]
name = "pad-companion"
version = "0.1.0"
edition = "2021"
description = "Pad Companion for the Google Stadia controller"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pad-core = { path = "../../crates/pad-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
